name: horology tests

on: [push]

permissions:
  contents: read

jobs:

  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      - name: Check types
        run: |
          mypy .

      - name: Test with pytest
        run: |
          pytest

  # Single required status check for branch protection, independent of
  # the matrix. It must run always, as a skipped check counts as passed.
  tests-passed:
    name: tests passed
    if: always()
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check that all test jobs passed
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          test "$RESULT" = success
